<!DOCTYPE html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <title>Slide 16 - Security ялгаа</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #0d0d0d, #1c1c1c, #3a3a3a);
        color: #fff;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      }
      h1 {
        font-size: 3em;
        margin-bottom: 20px;
      }
      .content {
        background: rgba(255, 255, 255, 0.05);
        padding: 40px;
        border-radius: 15px;
        width: 1000px;
        max-width: 95vw;
        text-align: center;
      }
      .comparison {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
        margin-top: 30px;
      }
      .security-card {
        padding: 30px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.07);
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
        transition: 0.3s;
      }
      .security-card:hover {
        transform: translateY(-5px);
      }
      .safe {
        border: 3px solid #4caf50;
        background: rgba(76, 175, 80, 0.15);
      }
      .risky {
        border: 3px solid #f44336;
        background: rgba(244, 67, 54, 0.15);
      }
      .security-icon {
        font-size: 4em;
        margin-bottom: 10px;
      }
      .security-details {
        font-size: 1.2em;
        line-height: 1.7;
      }
      .highlight {
        color: #ffeb3b;
      }
    </style>
  </head>

  <body>
    <h1>Security ялгаа</h1>

    <div class="content">
      <div class="comparison">
        <div class="security-card safe">
          <div class="security-icon">🛡️</div>
          <h2>Процесс</h2>
          <div class="security-details">
            ✔ Тусдаа санах ойтой → <span class="highlight">аюулгүй</span
            ><br /><br />
            ✔ Нэг процесс уналаа → бусдад нөлөөлөхгүй<br />
            ✔ Нууцлал өндөр түвшинд
          </div>
        </div>

        <div class="security-card risky">
          <div class="security-icon">⚠️</div>
          <h2>Thread</h2>
          <div class="security-details">
            ⚠ Shared memory → алдаа гарахад бүх Thread нөлөөлнө<br /><br />
            ⚠ Race condition эрсдэлтэй<br />
            ⚠ Synchronization алдаа → deadlock / data corruption үүснэ
          </div>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("keydown", (e) => {
        if (e.key.toLowerCase() === "d") location.href = "slide20.html";
        if (e.key.toLowerCase() === "a") location.href = "slide16.html";
      });
    </script>
  </body>
</html>
