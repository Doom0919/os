<!DOCTYPE html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <title>Slide 15 - Performance ялгаа</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #0d0d0d, #1c1c1c, #3a3a3a);
        color: #fff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      h1 {
        font-size: 3em;
        margin-bottom: 20px;
        text-shadow: 0 0 15px rgba(255, 235, 59, 0.7);
      }
      .content {
        background: rgba(255, 255, 255, 0.05);
        padding: 40px;
        border-radius: 15px;
        width: 1000px;
        max-width: 95vw;
        text-align: center;
        animation: fadeIn 1.5s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .perf-cards {
        display: flex;
        flex-direction: column;
        gap: 25px;
        margin-top: 30px;
      }
      .perf-card {
        background: rgba(255, 255, 255, 0.03);
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
        transition: 0.3s;
      }
      .perf-card:hover {
        transform: translateX(10px);
      }
      .comparison-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 15px;
      }
      .comparison-item {
        padding: 15px;
        border-radius: 8px;
        font-size: 1.1em;
      }
      .process {
        background: rgba(33, 150, 243, 0.2);
        border-left: 5px solid #2196f3;
      }
      .thread {
        background: rgba(255, 152, 0, 0.2);
        border-left: 5px solid #ff9800;
      }
      h3 {
        color: #ffeb3b;
        font-size: 1.7em;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Гүйцэтгэлийн ялгаа</h1>

    <div class="content">
      <div class="perf-cards">
        <div class="perf-card">
          <h3>Communication</h3>
          <div class="comparison-row">
            <div class="comparison-item process">
              <strong>Process:</strong><br />
              IPC ашиглана → 🐢 удаан
            </div>
            <div class="comparison-item thread">
              <strong>Thread:</strong><br />
              Shared memory → ⚡ хурдан
            </div>
          </div>
        </div>

        <div class="perf-card">
          <h3>Context Switching</h3>
          <div class="comparison-row">
            <div class="comparison-item process">
              Бүх процессийн context солигдоно → удаан
            </div>
            <div class="comparison-item thread">
              Зөвхөн register солигдоно → хурдан
            </div>
          </div>
        </div>

        <div class="perf-card">
          <h3>Creation Cost</h3>
          <div class="comparison-row">
            <div class="comparison-item process">
              Процесс үүсгэх нь их нөөц шаарддаг
            </div>
            <div class="comparison-item thread">
              Thread үүсэх нь хөнгөн, хурдан
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("keydown", (e) => {
        if (e.key.toLowerCase() === "d") location.href = "slide17.html";
        if (e.key.toLowerCase() === "a") location.href = "slide15.html";
      });
    </script>
  </body>
</html>
