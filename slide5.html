<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <title>Slide 6 - Thread Lifecycle</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #0d0d0d, #1c1c1c, #3a3a3a);
        color: #fff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow: hidden;
      }

      h1 {
        font-size: 3em;
        margin-bottom: 20px;
        text-shadow: 0 0 15px rgba(255, 235, 59, 0.7);
        animation: glow 2s infinite alternate;
      }

      @keyframes glow {
        from {
          text-shadow: 0 0 10px rgba(255, 235, 59, 0.6);
        }
        to {
          text-shadow: 0 0 25px rgba(255, 235, 59, 1);
        }
      }

      .content {
        background: rgba(255, 255, 255, 0.05);
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
        max-width: 1100px;
        text-align: center;
        animation: fadeIn 1.5s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .content p {
        font-size: 1.3em;
        line-height: 1.6;
        margin-bottom: 30px;
      }

      .highlight {
        color: #ffeb3b;
        font-weight: bold;
      }

      .lifecycle-diagram {
        position: relative;
        width: 100%;
        height: 400px;
        margin-top: 20px;
      }

      .state {
        position: absolute;
        background: #2196f3;
        padding: 20px 30px;
        border-radius: 15px;
        font-weight: bold;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
        transition: all 0.3s ease;
      }

      .state:hover {
        transform: scale(1.1);
        box-shadow: 0 8px 25px rgba(33, 150, 243, 0.8);
      }

      .state.new {
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #4caf50;
      }
      .state.ready {
        top: 140px;
        left: 15%;
        background: #ff9800;
      }
      .state.running {
        top: 140px;
        left: 50%;
        transform: translateX(-50%);
        background: #f44336;
        animation: runningPulse 2s infinite;
      }
      .state.waiting {
        top: 140px;
        right: 15%;
        background: #9c27b0;
      }
      .state.terminated {
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #607d8b;
      }

      @keyframes runningPulse {
        0%,
        100% {
          box-shadow: 0 6px 15px rgba(244, 67, 54, 0.5);
        }
        50% {
          box-shadow: 0 8px 30px rgba(244, 67, 54, 1);
        }
      }

      .arrow {
        position: absolute;
        font-size: 2em;
        color: #ffeb3b;
        animation: arrowMove 2s infinite ease-in-out;
      }

      @keyframes arrowMove {
        0%,
        100% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
          transform: scale(1.2);
        }
      }

      .arrow1 {
        top: 100px;
        left: 48%;
      }
      .arrow2 {
        top: 160px;
        left: 28%;
      }
      .arrow3 {
        top: 160px;
        right: 28%;
      }
      .arrow4 {
         top: 160px;
        left: 35%;
        transform: rotate(180deg);
      }
      .arrow5 {
        top: 160px;
        right: 35%;
        transform: rotate(180deg);
      }
      .arrow6 {
        bottom: 120px;
        left: 48%;
        transform: rotate(90deg);
      }

      .label {
        position: absolute;
        font-size: 0.85em;
        color: #bbbbbb;
        font-style: italic;
      }

      .label1 {
        top: 85px;
        left: 55%;
      }
      .label2 {
        top: 120px;
        left: 28%;
      }
      .label3 {
        top: 120px;
        right: 25%;
      }
      .label4 {
        top: 200px;
        left: 30%;
      }
      .label5 {
        top: 200px;
        right: 27%;
      }
      .label6 {
        bottom: 85px;
        left: 53%;
      }

      .hint {
        margin-top: 30px;
        font-size: 1em;
        color: #bbbbbb;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <h1>Process Lifecycle</h1>
    <div class="content">
      <p>
        <span class="highlight">Process-ын амьдралын мөчлөг</span> нь төрөлт
        (New)-ээс эхлээд дуусгавар (Terminated) хүртэлх
        <span class="highlight">төлөвүүдийг</span> илэрхийлнэ.
      </p>

      <div class="lifecycle-diagram">
       <video width="800" height="400" controls autoplay loop>
  <source src="1112.mp4" type="video/mp4">
</video>

      </div>
    </div>



    <script>
      document.addEventListener("keydown", function (event) {
        if (event.key.toLowerCase() === "d") {
          window.location.href = "slide7.html";
        }
        if (event.key.toLowerCase() === "a") {
          window.location.href = "slide5.html";
        }
      });
    </script>
  </body>
</html>
