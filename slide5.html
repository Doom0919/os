<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <title>Slide 5 - Процессын төлөвүүд</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #0d0d0d, #1c1c1c, #3a3a3a);
        color: #fff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow: hidden;
      }

      h1 {
        font-size: 3em;
        margin-bottom: 20px;
        text-shadow: 0 0 15px rgba(255, 235, 59, 0.7);
        animation: glow 2s infinite alternate;
      }

      @keyframes glow {
        from {
          text-shadow: 0 0 10px rgba(255, 235, 59, 0.6);
        }
        to {
          text-shadow: 0 0 25px rgba(255, 235, 59, 1);
        }
      }

      .content {
        background: rgba(255, 255, 255, 0.05);
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
        max-width: 95vw;
        width: 1000px;
        text-align: center;
        animation: fadeIn 1.5s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .states-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        margin-top: 30px;
      }

      .state-card {
        background: rgba(33, 150, 243, 0.2);
        border: 3px solid #2196f3;
        padding: 30px;
        border-radius: 15px;
        min-width: 200px;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
        transition: all 0.3s ease;
      }

      .state-card:hover {
        transform: translateY(-10px) scale(1.05);
        box-shadow: 0 10px 30px rgba(33, 150, 243, 0.8);
      }

      .state-card.new {
        border-color: #4caf50;
        background: rgba(76, 175, 80, 0.2);
      }
      .state-card.ready {
        border-color: #ff9800;
        background: rgba(255, 152, 0, 0.2);
      }
      .state-card.running {
        border-color: #f44336;
        background: rgba(244, 67, 54, 0.2);
        animation: runningPulse 2s infinite;
      }
      .state-card.waiting {
        border-color: #9c27b0;
        background: rgba(156, 39, 176, 0.2);
      }
      .state-card.terminated {
        border-color: #607d8b;
        background: rgba(96, 125, 139, 0.2);
      }

      @keyframes runningPulse {
        0%,
        100% {
          box-shadow: 0 6px 15px rgba(244, 67, 54, 0.5);
        }
        50% {
          box-shadow: 0 10px 35px rgba(244, 67, 54, 1);
        }
      }

      .state-icon {
        font-size: 3em;
        margin-bottom: 10px;
      }

      .state-name {
        font-size: 1.8em;
        font-weight: bold;
        margin-bottom: 10px;
      }

      .state-card.new .state-name {
        color: #4caf50;
      }
      .state-card.ready .state-name {
        color: #ff9800;
      }
      .state-card.running .state-name {
        color: #f44336;
      }
      .state-card.waiting .state-name {
        color: #9c27b0;
      }
      .state-card.terminated .state-name {
        color: #607d8b;
      }

      .state-desc {
        font-size: 1em;
        color: #ddd;
      }

      .hint {
        margin-top: 30px;
        font-size: 1em;
        color: #bbbbbb;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <h1>Процессын төлөвүүд</h1>
    <div class="content">
      <div class="states-container">
        <div class="state-card new">
          <div class="state-icon">🆕</div>
          <div class="state-name">New</div>
          <div class="state-desc">Шинээр үүссэн</div>
        </div>

        <div class="state-card ready">
          <div class="state-icon">⏳</div>
          <div class="state-name">Ready</div>
          <div class="state-desc">CPU хүлээж буй</div>
        </div>

        <div class="state-card running">
          <div class="state-icon">▶️</div>
          <div class="state-name">Running</div>
          <div class="state-desc">Ажиллаж буй</div>
        </div>

        <div class="state-card waiting">
          <div class="state-icon">⏸️</div>
          <div class="state-name">Waiting</div>
          <div class="state-desc">I/O хүлээж буй</div>
        </div>

        <div class="state-card terminated">
          <div class="state-icon">✅</div>
          <div class="state-name">Terminated</div>
          <div class="state-desc">Дууссан</div>
        </div>
      </div>
    </div>

    <div class="hint">
      💡 'D' → дараагийн слайд | 'A' → өмнөх слайд руу буцах
    </div>

    <script>
      document.addEventListener("keydown", function (event) {
        if (event.key.toLowerCase() === "d") {
          window.location.href = "slide6.html";
        }
        if (event.key.toLowerCase() === "a") {
          window.location.href = "slide4.html";
        }
      });
    </script>
  </body>
</html>
