<!DOCTYPE html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <title>Slide 17 - Conclusion</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #0d0d0d, #1c1c1c, #3a3a3a);
        color: #fff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }
      h1 {
        font-size: 3em;
        margin-bottom: 20px;
        text-shadow: 0 0 15px rgba(255, 235, 59, 0.7);
      }
      .content {
        background: rgba(255, 255, 255, 0.05);
        padding: 35px;
        border-radius: 15px;
        width: 900px;
        max-width: 95vw;
        text-align: center;
      }
      .conclusion-box {
        background: rgba(76, 175, 80, 0.15);
        border: 3px solid #4caf50;
        padding: 25px;
        border-radius: 12px;
      }
      .point {
        margin: 12px 0;
        background: rgba(255, 255, 255, 0.07);
        padding: 15px;
        border-left: 4px solid #4caf50;
        border-radius: 6px;
        font-size: 1.15em;
        text-align: left;
      }
      .highlight {
        color: #ffeb3b;
        font-weight: bold;
      }
      .thank-you {
        margin-top: 25px;
        font-size: 2em;
        color: #ffeb3b;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <h1>Дүгнэлт</h1>

    <div class="content">
      <div class="conclusion-box">
        <div class="point">
          ✔ <span class="highlight">Process</span> — тусдаа санах ойтой,
          тогтвортой.
        </div>

        <div class="point">
          ✔ <span class="highlight">Thread</span> — shared memory ашигладаг тул
          хурдан, хөнгөн.
        </div>

        <div class="point">✔ Performance → Threads илүү хурдан харилцдаг.</div>

        <div class="point">
          ✔ Security → Processes илүү найдвартай, тусгаарлагдсан.
        </div>

        <div class="point">
          ✔ Synchronization → Threads дээр зайлшгүй хэрэгтэй.
        </div>
      </div>

      <div class="thank-you">Анхаарал хандуулсанд баярлалаа! 🎉</div>
    </div>

    <script>
      document.addEventListener("keydown", (e) => {
        if (e.key.toLowerCase() === "a") location.href = "slide17.html";
      });
    </script>
  </body>
</html>
