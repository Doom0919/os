<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <title>Slide - Thread гэж юу вэ</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #0d0d0d, #1c1c1c, #3a3a3a);
        color: #fff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow: hidden;
      }

      h1 {
        font-size: 3em;
        margin-bottom: 20px;
        text-shadow: 0 0 15px rgba(255, 235, 59, 0.7);
        animation: glow 2s infinite alternate;
      }

      @keyframes glow {
        from {
          text-shadow: 0 0 10px rgba(255, 235, 59, 0.6);
        }
        to {
          text-shadow: 0 0 25px rgba(255, 235, 59, 1);
        }
      }

      .content {
        background: rgba(255, 255, 255, 0.05);
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
        max-width: 1000px;
        text-align: center;
        animation: fadeIn 1.5s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .content p {
        font-size: 1.4em;
        line-height: 1.8;
        margin-bottom: 30px;
      }

      .highlight {
        color: #ffeb3b;
        font-weight: bold;
      }

      /* Thread visualization */
      .thread-container {
        position: relative;
        width: 100%;
        height: 350px;
        margin-top: 30px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .process-box {
        position: relative;
        background: rgba(33, 150, 243, 0.2);
        border: 3px solid #2196f3;
        border-radius: 15px;
        padding: 40px;
        width: 700px;
        height: 300px;
        box-shadow: 0 6px 20px rgba(33, 150, 243, 0.4);
      }

      .process-label {
        position: absolute;
        top: -15px;
        left: 20px;
        background: #2196f3;
        padding: 5px 15px;
        border-radius: 8px;
        font-weight: bold;
        font-size: 0.9em;
      }

      .threads-wrapper {
        display: flex;
        justify-content: space-around;
        align-items: center;
        height: 100%;
        gap: 15px;
      }

      .thread-item {
        background: #ff9800;
        padding: 20px;
        border-radius: 10px;
        color: #fff;
        font-weight: bold;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        min-width: 100px;
        text-align: center;
        animation: threadPulse 2s infinite ease-in-out;
        position: relative;
      }

      .thread-item:nth-child(1) {
        animation-delay: 0s;
      }
      .thread-item:nth-child(2) {
        animation-delay: 0.4s;
      }
      .thread-item:nth-child(3) {
        animation-delay: 0.8s;
      }
      .thread-item:nth-child(4) {
        animation-delay: 1.2s;
      }

      @keyframes threadPulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.9;
        }
        50% {
          transform: scale(1.08);
          opacity: 1;
          box-shadow: 0 6px 20px rgba(255, 152, 0, 0.6);
        }
      }

      .thread-arrow {
        position: absolute;
        bottom: -25px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        border-top: 12px solid #ff9800;
        animation: arrowBounce 1.5s infinite ease-in-out;
      }

      @keyframes arrowBounce {
        0%,
        100% {
          transform: translateX(-50%) translateY(0);
        }
        50% {
          transform: translateX(-50%) translateY(5px);
        }
      }

      .shared-resources {
        margin-top: 50px;
        display: flex;
        justify-content: center;
        gap: 20px;
      }

      .resource {
        background: rgba(76, 175, 80, 0.3);
        border: 2px solid #4caf50;
        padding: 15px 25px;
        border-radius: 10px;
        font-size: 0.9em;
        box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
      }

      .hint {
        margin-top: 30px;
        font-size: 1em;
        color: #bbbbbb;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <h1>Thread гэж юу вэ?</h1>
    <div class="content">
      <p>
        <span class="highlight">Thread</span> (Урсгал) нь процессийн доторх
        <span class="highlight">гүйцэтгэлийн хамгийн жижиг нэгж</span> юм. Нэг
        процесс дотор олон thread-үүд зэрэг ажиллаж, нөөцийг хамтран ашигладаг.
      </p>

      <div class="thread-container">
        <div class="process-box">
          <div class="process-label">ПРОЦЕСС</div>
          <div class="threads-wrapper">
            <div class="thread-item">
              Thread 1
              <div class="thread-arrow"></div>
            </div>
            <div class="thread-item">
              Thread 2
              <div class="thread-arrow"></div>
            </div>
            <div class="thread-item">
              Thread 3
              <div class="thread-arrow"></div>
            </div>
            <div class="thread-item">
              Thread 4
              <div class="thread-arrow"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="shared-resources">
        <div class="resource">📦 Санах ой</div>
        <div class="resource">💾 Өгөгдөл</div>
        <div class="resource">📁 Файл</div>
      </div>
    </div>

    <div class="hint">
      💡 'D' → дараагийн слайд | 'A' → өмнөх слайд руу буцах
    </div>

    <script>
      document.addEventListener("keydown", function (event) {
        if (event.key.toLowerCase() === "d") {
          window.location.href = "slide5.html";
        }
        if (event.key.toLowerCase() === "a") {
          window.location.href = "slide3.html";
        }
      });
    </script>
  </body>
</html>
