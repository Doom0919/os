<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <title>Slide 4 - Процессын бүтэц</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #0d0d0d, #1c1c1c, #3a3a3a);
        color: #fff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow: hidden;
      }

      h1 {
        font-size: 3em;
        margin-bottom: 20px;
        text-shadow: 0 0 15px rgba(255, 235, 59, 0.7);
        animation: glow 2s infinite alternate;
      }

      @keyframes glow {
        from {
          text-shadow: 0 0 10px rgba(255, 235, 59, 0.6);
        }
        to {
          text-shadow: 0 0 25px rgba(255, 235, 59, 1);
        }
      }

      .content {
        background: rgba(255, 255, 255, 0.05);
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
        max-width: 95vw;
        width: 1000px;
        text-align: center;
        animation: fadeIn 1.5s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .structure-container {
        display: flex;
        justify-content: center;
        margin-top: 30px;
      }

      .structure-stack {
        width: 500px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .structure-item {
        background: linear-gradient(135deg, #2196f3, #1976d2);
        padding: 25px;
        border-radius: 10px;
        font-size: 1.3em;
        font-weight: bold;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
        transition: all 0.3s ease;
        position: relative;
      }

      .structure-item:hover {
        transform: scale(1.05);
        box-shadow: 0 10px 30px rgba(33, 150, 243, 0.8);
      }

      .structure-item:nth-child(1) {
        background: linear-gradient(135deg, #f44336, #d32f2f);
      }
      .structure-item:nth-child(2) {
        background: linear-gradient(135deg, #ff9800, #f57c00);
      }
      .structure-item:nth-child(3) {
        background: linear-gradient(135deg, #4caf50, #388e3c);
      }
      .structure-item:nth-child(4) {
        background: linear-gradient(135deg, #9c27b0, #7b1fa2);
      }
      .structure-item:nth-child(5) {
        background: linear-gradient(135deg, #2196f3, #1976d2);
      }

      .description {
        font-size: 0.8em;
        font-weight: normal;
        opacity: 0.9;
        margin-top: 5px;
      }

      .hint {
        margin-top: 30px;
        font-size: 1em;
        color: #bbbbbb;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <h1>Процессын бүтэц</h1>
    <div class="content">
      <div class="structure-container">
        <div class="structure-stack">
          <div class="structure-item">
            📄 Code сегмент
            <div class="description">Програмын код</div>
          </div>
          <div class="structure-item">
            💾 Data сегмент
            <div class="description">Глобал болон статик өгөгдөл</div>
          </div>
          <div class="structure-item">
            📚 Stack
            <div class="description">Функц дуудалт, локал хувьсагч</div>
          </div>
          <div class="structure-item">
            🗄️ Heap
            <div class="description">Динамик санах ойн хуваарилалт</div>
          </div>
          <div class="structure-item">
            🎛️ Registers + Program Counter
            <div class="description">CPU регистр, програмын тоолуур</div>
          </div>
        </div>
      </div>
    </div>

    <div class="hint">
      💡 'D' → дараагийн слайд | 'A' → өмнөх слайд руу буцах
    </div>

    <script>
      document.addEventListener("keydown", function (event) {
        if (event.key.toLowerCase() === "d") {
          window.location.href = "slide5.html";
        }
        if (event.key.toLowerCase() === "a") {
          window.location.href = "slide3.html";
        }
      });
    </script>
  </body>
</html>
