<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <title>Үйлдлийн систем - Танилцуулга</title>
    <style>
        /* Base styles */
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #000000 0%, #1c1c1c 60%, #434343 100%);
            color: #ffffff;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .content {
            display: flex;
            flex-direction: row;
            
        }
        /* Heading */
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 3px 3px 8px rgba(0,0,0,0.7);
            transition: transform 0.3s ease;
        }
        h1:hover {
            transform: scale(1.05);
        }

        /* Paragraph */
        p {
            font-size: 1.4em;
            max-width: 900px;
            line-height: 1.8;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.4);
            margin: 15px auto;
        }

        .highlight {
            color: #ffeb3b;
            font-weight: bold;
        }

        /* Image */
        img {
            max-width: 80%;
            height: auto;
            margin-top: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        img:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 2.2em; }
            p { font-size: 1.2em; }
            img { max-width: 95%; }
        }
    </style>
</head>
<body>
    <h1>Үйлдлийн систем гэж юу вэ?</h1>
    <div class="content">
         <p>
        Үйлдлийн систем нь компьютерын <span class="highlight">hardware</span> болон
        хэрэглэгчийн програмуудын хоорондох дунд шатны програм хангамж бөгөөд
        <span class="highlight">ресурсуудыг удирдан зохион байгуулж</span>,
        програмуудыг аюулгүй, үр дүнтэй ажиллуулах боломжийг олгодог.
    </p>
    <img src="./Image/image.png" alt="Үйлдлийн системийн бүтэц">

    </div>
    <script>
        document.addEventListener('keydown', function(event) {
            if(event.key === 'd' || event.key === 'D') {
                window.location.href = 'slide1.html'; // Slide1 руу шилжих
            }
        });
    </script>
</body>
</html>
