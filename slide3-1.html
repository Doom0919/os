<!doctype html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <title>CPU Scheduling - Slide 1</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0d0d0d, #1c1c1c, #3a3a3a);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    h1 {
      font-size: 3.5em;
      margin-bottom: 20px;
      text-shadow: 0 0 15px rgba(255, 235, 59, 0.7);
      animation: glow 2s infinite alternate;
      text-align: center;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 10px rgba(255, 235, 59, 0.6);
      }
      to {
        text-shadow: 0 0 25px rgba(255, 235, 59, 1);
      }
    }

    .slide-number {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 1.2em;
      color: #ffeb3b;
      font-weight: bold;
    }

    .content {
      background: rgba(255, 255, 255, 0.05);
      padding: 50px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
      max-width: 1200px;
      width: 100%;
      animation: fadeIn 1.5s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .intro {
      text-align: center;
      font-size: 1.5em;
      line-height: 1.8;
      margin-bottom: 40px;
      color: #e0e0e0;
    }

    .highlight {
      color: #ffeb3b;
      font-weight: bold;
    }

    .section {
      margin: 30px 0;
      padding: 25px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      border-left: 5px solid #2196f3;
    }

    .section h2 {
      color: #4caf50;
      font-size: 1.8em;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section p {
      font-size: 1.2em;
      line-height: 1.8;
      color: #e0e0e0;
      margin-bottom: 15px;
    }

    .section ul {
      margin-left: 30px;
      margin-top: 15px;
    }

    .section li {
      font-size: 1.1em;
      margin-bottom: 12px;
      line-height: 1.6;
      color: #bbbbbb;
    }

    .icon {
      display: inline-block;
      width: 35px;
      height: 35px;
      background: #ffeb3b;
      border-radius: 50%;
      text-align: center;
      line-height: 35px;
      color: #000;
      font-weight: bold;
      font-size: 1.2em;
    }

    .cpu-diagram {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      margin: 40px 0;
      padding: 30px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
    }

    .cpu-box {
      width: 150px;
      height: 150px;
      background: #f44336;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.3em;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(244, 67, 54, 0.5);
      animation: cpuPulse 2s infinite;
    }

    @keyframes cpuPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 8px 20px rgba(244, 67, 54, 0.5);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 12px 30px rgba(244, 67, 54, 0.8);
      }
    }

    .process-queue {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .process-item {
      width: 120px;
      padding: 15px;
      background: #2196f3;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .process-item:hover {
      transform: translateX(10px);
      background: #1976d2;
    }

    .arrow {
      font-size: 3em;
      color: #ffeb3b;
      animation: arrowBounce 1.5s infinite;
    }

    @keyframes arrowBounce {
      0%, 100% {
        transform: translateX(0);
      }
      50% {
        transform: translateX(10px);
      }
    }

    .navigation {
      margin-top: 50px;
      text-align: center;
      font-size: 1.1em;
      color: #bbbbbb;
      font-style: italic;
    }

    .key-points {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 30px;
    }

    .point-card {
      padding: 20px;
      background: rgba(33, 150, 243, 0.1);
      border-radius: 10px;
      border: 2px solid #2196f3;
      transition: all 0.3s ease;
    }

    .point-card:hover {
      border-color: #ffeb3b;
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(255, 235, 59, 0.3);
    }

    .point-card h3 {
      color: #ffeb3b;
      margin-bottom: 10px;
      font-size: 1.3em;
    }

    .point-card p {
      color: #e0e0e0;
      font-size: 1.05em;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <h1>CPU Scheduling</h1>
  
  <div class="content">
    <p class="intro">
      <span class="highlight">CPU Scheduling</span> нь үйлдлийн системийн <span class="highlight">гол үндсэн үүрэг</span> бөгөөд 
      олон процессуудыг CPU дээр <span class="highlight">үр ашигтай ажиллуулах</span> арга юм.
    </p>

    <div class="cpu-diagram">
      <div class="process-queue">
        <div class="process-item">Process 1</div>
        <div class="process-item">Process 2</div>
        <div class="process-item">Process 3</div>
        <div class="process-item">Process 4</div>
      </div>
      
      <div class="arrow">→</div>
      
      <div class="cpu-box">
        <div>🔥 CPU</div>
        <div style="font-size: 0.7em; margin-top: 10px;">Scheduler</div>
      </div>
    </div>

   

   

 <script>
      document.addEventListener("keydown", function (event) {
        if (event.key.toLowerCase() === "d") {
          window.location.href = "slide3-2.html";
        }
        if (event.key.toLowerCase() === "a") {
          window.location.href = "slide5.html";
        }
      });
    </script>
</body>
</html>
