<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <title>Slide 1 - Танилцуулга</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #0d0d0d, #1c1c1c, #3a3a3a);
        color: #fff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow: hidden;
      }

      h1 {
        font-size: 3em;
        margin-bottom: 20px;
        text-shadow: 0 0 15px rgba(255, 235, 59, 0.7);
        animation: glow 2s infinite alternate;
      }

      @keyframes glow {
        from {
          text-shadow: 0 0 10px rgba(255, 235, 59, 0.6);
        }
        to {
          text-shadow: 0 0 25px rgba(255, 235, 59, 1);
        }
      }

      .content {
        background: rgba(255, 255, 255, 0.05);
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
        max-width: 95vw;
        width: 1000px;
        text-align: center;
        animation: fadeIn 1.5s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .intro-text {
        font-size: 1.5em;
        line-height: 1.8;
        margin-bottom: 40px;
        color: #ddd;
      }

      .highlight {
        color: #ffeb3b;
        font-weight: bold;
      }

      .cards-container {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 25px;
        margin-top: 30px;
      }

      .card {
        background: rgba(33, 150, 243, 0.2);
        border: 3px solid #2196f3;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
        transition: all 0.3s ease;
      }

      .card:hover {
        transform: translateY(-8px);
        box-shadow: 0 10px 30px rgba(33, 150, 243, 0.8);
      }

      .card h2 {
        color: #2196f3;
        font-size: 2em;
        margin-bottom: 15px;
      }

      .card p {
        font-size: 1.2em;
        line-height: 1.6;
      }

      .bottom-note {
        margin-top: 40px;
        padding: 20px;
        background: rgba(76, 175, 80, 0.2);
        border-left: 4px solid #4caf50;
        border-radius: 8px;
        font-size: 1.2em;
      }

      .hint {
        margin-top: 30px;
        font-size: 1em;
        color: #bbbbbb;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <h1>Процесс ба Thread танилцуулга</h1>
    <div class="content">
      <div class="intro-text">
        Компьютер олон ажил зэрэг хийхдээ
        <span class="highlight">процесс ба thread</span> ашиглана
      </div>

      <div class="cards-container">
        <div class="card">
          <h2>📦 Процесс</h2>
          <p>Бие даасан програм</p>
        </div>

        <div class="card">
          <h2>⚡ Thread</h2>
          <p>Процесс доторх гүйцэтгэгч урсгал</p>
        </div>
      </div>

      <div class="bottom-note">
        💡 Эдгээр нь OS-ийн <span class="highlight">concurrency</span>-ийн үндэс
      </div>
    </div>

    <div class="hint">
      💡 'D' → дараагийн слайд | 'A' → өмнөх слайд руу буцах
    </div>

    <script>
      document.addEventListener("keydown", function (event) {
        if (event.key.toLowerCase() === "d") {
          window.location.href = "slide2.html";
        }
        if (event.key.toLowerCase() === "a") {
          window.location.href = "intro.html";
        }
      });
    </script>
  </body>
</html>
