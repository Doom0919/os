<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <title>Slide 2 - Процесс гэж юу вэ</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #0d0d0d, #1c1c1c, #3a3a3a);
        color: #fff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow: hidden;
      }

      h1 {
        font-size: 3em;
        margin-bottom: 20px;
        text-shadow: 0 0 15px rgba(255, 235, 59, 0.7);
        animation: glow 2s infinite alternate;
      }

      @keyframes glow {
        from {
          text-shadow: 0 0 10px rgba(255, 235, 59, 0.6);
        }
        to {
          text-shadow: 0 0 25px rgba(255, 235, 59, 1);
        }
      }

      .content {
        background: rgba(255, 255, 255, 0.05);
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
        max-width: 95vw;
        width: 1000px;
        text-align: center;
        animation: fadeIn 1.5s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .highlight {
        color: #ffeb3b;
        font-weight: bold;
      }

      .definition-box {
        background: rgba(33, 150, 243, 0.2);
        border: 3px solid #2196f3;
        padding: 30px;
        border-radius: 12px;
        font-size: 1.5em;
        line-height: 1.8;
        margin-bottom: 40px;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
      }

      .features {
        display: grid;
        grid-template-columns: 1fr;
        gap: 15px;
        margin-top: 30px;
      }

      .feature-item {
        background: rgba(255, 152, 0, 0.2);
        border-left: 5px solid #ff9800;
        padding: 20px;
        border-radius: 8px;
        text-align: left;
        font-size: 1.2em;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        transition: all 0.3s ease;
      }

      .feature-item:hover {
        transform: translateX(10px);
        box-shadow: 0 6px 20px rgba(255, 152, 0, 0.6);
      }

      .feature-icon {
        font-size: 1.5em;
        margin-right: 10px;
      }

      .hint {
        margin-top: 30px;
        font-size: 1em;
        color: #bbbbbb;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <h1>Процесс гэж юу вэ?</h1>
    <div class="content">
      <div class="definition-box">
        Санах ойд ачаалагдсан,
        <span class="highlight">бие даан ажиллаж буй</span> програм
      </div>

      <div class="features">
        <div class="feature-item">
          <span class="feature-icon">💾</span>
          Өөрийн гэсэн <span class="highlight">memory space</span>,
          resources-тай
        </div>

        <div class="feature-item">
          <span class="feature-icon">🆔</span>
          OS процесс бүрт <span class="highlight">ID</span> өгдөг (PID)
        </div>

        <div class="feature-item">
          <span class="feature-icon">🔒</span>
          Бусад процессоос <span class="highlight">тусгаарлагдсан</span>
        </div>
      </div>
    </div>

    <div class="hint">
      💡 'D' → дараагийн слайд | 'A' → өмнөх слайд руу буцах
    </div>

    <script>
      document.addEventListener("keydown", function (event) {
        if (event.key.toLowerCase() === "d") {
          window.location.href = "slide3.html";
        }
        if (event.key.toLowerCase() === "a") {
          window.location.href = "slide1.html";
        }
      });
    </script>
  </body>
</html>
